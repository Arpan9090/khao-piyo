spring.application.name=khao-piyo

spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=khao-piyo

jwt.secret.key=${JWT_SECRET_KEY:YourSuperSecretKeyHere}

# Local File Upload Directory
file.upload-dir=uploads/

# Multipart File Size Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Razorpay
razorpay_key=${RAZORPAY_KEY}
razorpay_secret=${RAZORPAY_SECRET}

# Admin details
admin.email=admin@example.com
admin.password=${ADMIN_PASSWORD:admin123}